<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>instante</title>
    <meta property="og:title" content="instante" />
    <meta property="og:description" content="é como se soubesse tudo o que vejo" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f7f3f1;
        --fg: #2b2326;
        --muted: #8a7b80;
        --accent: #c2344d;
        --line: #e4d9d6;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1b1618;
          --fg: #efe6e8;
          --muted: #9c8c91;
          --accent: #ea5a72;
          --line: #3a2f33;
          color-scheme: dark;
        }
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 64px 16px;
        background: var(--bg);
        color: var(--fg);
        font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif;
      }

      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 48px;
      }

      h1 {
        margin: 0;
        font-size: 2rem;
        font-weight: 600;
        letter-spacing: 0.3em;
        text-transform: lowercase;
        color: var(--muted);
      }

      .poema {
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 0.9em;
        text-align: center;
        font-size: clamp(1.4rem, 4.5vw, 2rem);
        line-height: 1.3;
      }

      .poema p { margin: 0; }
      .poema .fim { font-style: italic; }

      .curtir {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 10px 20px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: transparent;
        color: var(--fg);
        font: inherit;
        font-size: 1.25rem;
        cursor: pointer;
        transition: border-color 0.2s, transform 0.15s;
      }
      .curtir:hover:not(:disabled) { border-color: var(--accent); }
      .curtir:active:not(:disabled) { transform: scale(0.96); }
      .curtir:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
      .curtir:disabled { cursor: default; }

      .curtir svg {
        width: 24px;
        height: 24px;
        fill: none;
        stroke: var(--accent);
        stroke-width: 2;
        transition: fill 0.2s;
      }
      .curtir.curtido svg { fill: var(--accent); }

      .contador { font-variant-numeric: tabular-nums; min-width: 1ch; }

      @media (prefers-reduced-motion: reduce) {
        .curtir { transition: none; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>instante</h1>

      <div class="poema">
        <p>é como se soubesse</p>
        <p>tudo o que vejo</p>
        <p>a mordida no seu lábio</p>
        <p>sua mão na minha pele</p>
        <p>o tempo de antes</p>
        <p>o presente</p>
        <p>e o depois</p>
        <p>pra mim</p>
        <p>quando você volta</p>
        <p class="fim">é sempre o melhor</p>
      </div>

      <button class="curtir" id="curtir" type="button" aria-label="Curtir o poema">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 21s-7.5-4.6-9.5-9.4C1.2 8.4 3.3 4.5 7 4.5c2.1 0 3.6 1.1 5 3 1.4-1.9 2.9-3 5-3 3.7 0 5.8 3.9 4.5 7.1C19.5 16.4 12 21 12 21z" />
        </svg>
        <span class="contador" id="contador">0</span>
      </button>
    </main>

    <script>
      // Contador compartilhado no serviço gratuito Abacus (https://abacus.jasoncameron.dev)
      const API = "https://abacus.jasoncameron.dev";
      const CHAVE = "clone-tabnews-ia-poema/instante";
      const MARCA = "poema-instante-curtido";

      const botao = document.getElementById("curtir");
      const contador = document.getElementById("contador");

      function jaCurtiu() {
        try { return localStorage.getItem(MARCA) === "1"; } catch { return false; }
      }

      function marcarCurtido() {
        try { localStorage.setItem(MARCA, "1"); } catch {}
        botao.classList.add("curtido");
        botao.disabled = true;
        botao.setAttribute("aria-label", "Você curtiu este poema");
      }

      async function carregar() {
        try {
          const r = await fetch(`${API}/get/${CHAVE}`);
          const dados = r.ok ? await r.json() : { value: 0 };
          contador.textContent = dados.value ?? 0;
        } catch {
          contador.textContent = "0";
        }
      }

      botao.addEventListener("click", async () => {
        if (jaCurtiu()) return;
        marcarCurtido();
        contador.textContent = (parseInt(contador.textContent, 10) || 0) + 1;
        try {
          const r = await fetch(`${API}/hit/${CHAVE}`);
          const dados = await r.json();
          contador.textContent = dados.value;
        } catch {}
      });

      if (jaCurtiu()) marcarCurtido();
      carregar();
    </script>
  </body>
</html>
